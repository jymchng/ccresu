name: Deploy website

# Publishes the landing page and the documentation site to GitHub Pages.
#
# The site is a static export (web/next.config.ts sets output: "export" and
# basePath "/ccresu"), built by `npm run build` into web/out and then pushed to
# the `gh-pages` branch, which Pages serves (build_type "legacy", source
# gh-pages:/).
#
# Why a branch and not actions/deploy-pages: the workflow originally uploaded a
# Pages artifact and called `actions/deploy-pages`. The deployment record sat in
# "queued"/"updating_pages" with an empty status for the full 10-minute poll
# limit, twice, and the site stayed 404 — the Pages deployment API never
# advanced for this repository. Publishing a branch is the older, dependable
# path: it needs nothing but a git push and a `contents: write` token, and the
# published tree is inspectable in the repository afterwards.
#
# There is deliberately NO `paths:` filter. Before, `paths: ["web/**", ...]`
# matched the push that introduced this workflow yet produced no run at all, so
# every push to the production branch now republishes. The build job runs the
# same lint, type check, test and export gates as CI, so a broken site is still
# never published, and a README- or docs-only change refreshes the site too.
on:
  push:
    branches: [main]
  # Manual re-publish (e.g. after a transient Pages outage).
  workflow_dispatch:

# Read-only by default; the publish job opts into contents: write.
permissions:
  contents: read

concurrency:
  group: pages
  # A publish must not cancel one in flight: the branch would keep whichever
  # force-push landed last.
  cancel-in-progress: false

jobs:
  build:
    name: Build the static export
    # Only the production branch may publish, including via manual dispatch
    # from another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (from the lockfile)
        run: npm ci

      # The same gates as CI run here, so a broken site is never published.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build static export
        run: npm run build

      # The SEO cross-check reads the export, so it runs after the build: every
      # built index.html must appear in sitemap.xml, robots.txt must point at
      # that sitemap, and every page's head must carry its own canonical and
      # og/twitter pair. `CCRESU_REQUIRE_EXPORT=1` (set by `npm run test:export`)
      # makes a missing export a failure instead of a skip.
      - name: Check the exported SEO surface
        run: npm run test:export

      - name: Upload the exported site
        uses: actions/upload-artifact@v4
        with:
          name: website-export
          path: web/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exported site
        uses: actions/download-artifact@v4
        with:
          name: website-export
          path: site

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd site
          # Pages runs the branch through Jekyll unless this marker exists, and
          # Jekyll would drop the _next/ asset directory.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy: website from ${SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
          echo "published $(git rev-parse --short HEAD) to gh-pages"
