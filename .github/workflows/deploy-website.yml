name: Deploy website

# Publishes the landing page and the documentation site to GitHub Pages.
#
# The site is a static export (web/next.config.ts sets output: "export" and
# basePath "/ccresu"), built by `npm run build` into web/out and then pushed to
# the `gh-pages` branch, which Pages serves (build_type "legacy", source
# gh-pages:/).
#
# Why a branch and not actions/deploy-pages: the workflow originally uploaded a
# Pages artifact and called `actions/deploy-pages`. The deployment record sat in
# "queued"/"updating_pages" with an empty status for the full 10-minute poll
# limit, twice, and the site stayed 404 — the Pages deployment API never
# advanced for this repository. Publishing a branch is the older, dependable
# path: it needs nothing but a git push and a `contents: write` token, and the
# published tree is inspectable in the repository afterwards.
#
# There is deliberately NO `paths:` filter. Before, `paths: ["web/**", ...]`
# matched the push that introduced this workflow yet produced no run at all, so
# every push to the production branch now republishes. The build job runs the
# same lint, type check, test and export gates as CI, so a broken site is still
# never published, and a README- or docs-only change refreshes the site too.
#
# `release: published` is how the site catches up with a release. The version
# the install commands name is resolved at build time, and the release order is
# "merge the version bump, then tag it" — so the deploy the merge triggers asks
# `releases/latest` before the tag exists and is told about the *previous*
# release. That is not theory: run 44883298831 built the 0.10.0 tree while the
# API still answered 0.9.2 and published a site advertising 0.9.2 on
# 2026-11-21. A deploy triggered by the release itself names the tag it was
# triggered by (`CCRESU_RELEASE_TAG`), which cannot race the API, and the guard
# step below stops any deploy — merge-triggered or not — from publishing a site
# whose install commands name a version the commit does not declare.
on:
  push:
    branches: [main]
  # Fires once the tag's release is public, i.e. after the archives and
  # checksums.txt exist for the version the site is about to advertise.
  release:
    types: [published]
  # Manual re-publish (e.g. after a transient Pages outage).
  workflow_dispatch:

# Read-only by default; the publish job opts into contents: write.
permissions:
  contents: read

concurrency:
  group: pages
  # A publish must not cancel one in flight: the branch would keep whichever
  # force-push landed last.
  cancel-in-progress: false

jobs:
  build:
    name: Build the static export
    # Only the production branch may publish, including via manual dispatch
    # from another ref. A published release is the one other allowed trigger:
    # it checks out the tagged commit — the tree the archives were built from —
    # and its ref is `refs/tags/<tag>`, which the first half of this condition
    # would reject.
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (from the lockfile)
        run: npm ci

      # The same gates as CI run here, so a broken site is never published.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build static export
        env:
          # Set only on a `release: published` run, empty on a push. When it is
          # set the build names this tag and never asks `releases/latest`, which
          # can still answer with the previous release for a few seconds after
          # this one goes public.
          CCRESU_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run build

      # The build resolves the version it advertises from GitHub, and a push to
      # `main` reaches the API before the tag exists — so the page it produces
      # can name the *previous* release. That is not hypothetical: deploy run
      # 44883298831 built the 0.10.0 tree and published an index.html telling
      # readers to install 0.9.2, and nothing failed. This step is the failure:
      # every page that shows install commands must advertise the version
      # `web/package.json` declares, and a mismatch stops the deploy instead of
      # publishing the page.
      #
      # `working-directory: .` because the script resolves `web/out` from the
      # repository root, while this job's default working directory is `web`.
      - name: Check the export names the version this commit declares
        working-directory: .
        run: node scripts/check-site-version.mjs

      # The SEO cross-check reads the export, so it runs after the build: every
      # built index.html must appear in sitemap.xml, robots.txt must point at
      # that sitemap, and every page's head must carry its own canonical and
      # og/twitter pair. `CCRESU_REQUIRE_EXPORT=1` (set by `npm run test:export`)
      # makes a missing export a failure instead of a skip.
      - name: Check the exported SEO surface
        run: npm run test:export

      # The only gate that measures the real thing: every other check is a claim
      # about markup, and jsdom has no layout engine. This walks the built export
      # in Chromium at 320/375/414/768/1024, asserts nothing overflows the
      # viewport, that every visible control is at least 44x44 CSS pixels, and
      # that the header and docs menus open, navigate and close on a phone.
      #
      # Its output (57 full-page screenshots plus report.json with a SHA-256 per
      # image) is uploaded below and is the point of running it in CI: locally
      # the directory is git-ignored, so before this step the evidence could only
      # be regenerated, never inspected by someone reviewing a deploy.
      - name: Install the Chromium the browser gate needs
        run: npx playwright install --with-deps chromium

      - name: Browser gate (layouts, menus, screenshots)
        run: npm run test:mobile

      # `if: always()` on purpose: the screenshots of a *failing* layout are the
      # ones worth downloading, so the evidence must survive a red gate. A green
      # build still gates the `deploy` job below, which `needs: build`.
      - name: Upload the browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-gate-evidence
          # Relative to the workspace root, not to the step's working-directory.
          path: web/tests/mobile/artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the exported site
        uses: actions/upload-artifact@v4
        with:
          name: website-export
          path: web/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exported site
        uses: actions/download-artifact@v4
        with:
          name: website-export
          path: site

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd site
          # Pages runs the branch through Jekyll unless this marker exists, and
          # Jekyll would drop the _next/ asset directory.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy: website from ${SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
          echo "published $(git rev-parse --short HEAD) to gh-pages"
