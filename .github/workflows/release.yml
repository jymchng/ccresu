name: Release

# Tag-driven: pushing v1.2.3 publishes ccresu_1.2.3_<os>_<arch> archives plus
# checksums.txt for the six supported targets. The archive names and the
# checksums file format are a contract with scripts/install.sh and with
# web/lib/site.ts, so they must not drift.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  # Nothing is published unless the tests and the coverage gate pass first.
  gate:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: coverage gate
        run: make cover-check

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Derive version metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "refusing to release suspicious tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          {
            echo "VERSION=$version"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # Pure-Go SQLite (modernc.org/sqlite) means no cgo and therefore true
      # cross-compilation: every target is built on one runner.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          binary="ccresu"
          [ "$GOOS" = "windows" ] && binary="ccresu.exe"
          mkdir -p staging "dist"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA -X main.buildDate=$BUILD_DATE" \
            -o "staging/$binary" ./cmd/ccresu
          # Ship the example configuration inside the archive: install.sh
          # installs it as ~/.config/ccresu/config.yaml when none exists.
          mkdir -p staging/configs
          cp configs/config.example.yaml staging/configs/config.example.yaml
          archive="ccresu_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "$GOOS" = "windows" ]; then
            ( cd staging && python3 -m zipfile -c "../dist/$archive.zip" "$binary" configs )
          else
            tar -czf "dist/$archive.tar.gz" -C staging "$binary" configs
          fi
          ls -l dist

      - name: Smoke-test the linux binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./staging/ccresu version
          ./staging/ccresu --help > /dev/null
          # Captured, not piped. This step runs without `pipefail`, so a SIGPIPE
          # here would be swallowed rather than fatal — but it is the same trap,
          # and adding `pipefail` later must not turn it into a flake.
          grep -q " $VERSION$" <<<"$(./staging/ccresu version)"

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Least privilege: only this job may write to the repository.
    permissions:
      contents: write
    steps:
      - name: Collect archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums.txt
        run: |
          set -eu
          cd dist
          find . -maxdepth 1 -type f -print | sort
          count=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "expected 6 archives, found $count" >&2
            exit 1
          fi
          # Bare file names: scripts/install.sh matches the asset name in this
          # file, and web/lib/site.ts links to it, so no directory prefix.
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ccresu ${GITHUB_REF_NAME#v}" \
            --verify-tag \
            --generate-notes
