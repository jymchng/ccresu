# ccresu example configuration.
#
# Copy to ~/.config/ccresu/config.yaml and edit.
# Every field below is validated at startup (`ccresu config validate`).
# Any field can be overridden with an environment variable using the
# CCRESU_ prefix and underscores for nesting, e.g.:
#
#   CCRESU_APP__LOG_LEVEL=debug
#   CCRESU_TELEGRAM__BOT_TOKEN=123:abc
#   CCRESU_RECOVERY__MAX_ATTEMPTS=5
#
# Environment variables always take precedence over this file.

app:
  name: ccresu
  log_level: info            # debug | info | warn | error
  log_format: json           # json | text
  timezone: Asia/Singapore   # IANA name used for display; reset times keep their own timezone

claude:
  executable: claude
  discovery_interval: 30s
  monitored_sessions: []     # explicit session IDs to monitor in addition to discovery
  discover_all_sessions: true
  resume_enabled: true
  default_model: ""          # empty = inherit from the original session
  default_effort: ""         # empty = inherit from the original session
  continuation_message: "Continue working on the existing active goal from where execution was interrupted by the usage limit. Review the current state, avoid repeating completed work, and continue until the goal is completed."

monitoring:
  enabled: true
  detect_usage_limits: true
  detect_session_completion: true
  # Also scan sessions in RESUMED, which a pass never revisits (it is settled), so
  # a new usage limit that lands in an already-resumed session's transcript is
  # found instead of being missed. A limit found there parks the session in
  # WAITING_FOR_RESET. The scan can only park a session, never resume one.
  # Default true; set false to restore the pre-0.8.0 behaviour.
  # Override with CCRESU_MONITORING__RESCAN_RESUMED.
  rescan_resumed: true

detector:
  # Minimum confidence, in (0, 1], for a detection to count. The built-in
  # canonical banners score 0.95-0.99; raising this above 0.99 disables them.
  # Override with CCRESU_DETECTOR__THRESHOLD.
  threshold: 0.5
  # Extra detection rules, evaluated alongside the built-in ones. Use this to
  # teach ccresu a phrasing it does not know yet without waiting for a release.
  # Each pattern is a Go regular expression matched against NORMALISED text:
  # lowercase, single-spaced, curly quotes and dashes folded to ASCII.
  #
  # custom_patterns:
  #   - id: internal-proxy-limit
  #     kind: five_hour            # optional: five_hour | weekly | other
  #     pattern: 'proxy quota exhausted'
  #     confidence: 0.9
  #     requires_reset: false
  #     description: our corporate proxy reports the limit differently

scheduler:
  poll_interval: 30s
  unknown_reset_initial_interval: 5m
  unknown_reset_max_interval: 30m

recovery:
  enabled: true
  max_attempts: 10
  initial_delay: 30s
  max_delay: 15m
  multiplier: 2.0
  jitter: 0.15
  # Bounds one resume turn: the whole `claude --resume <id> "<message>"` run,
  # including the model's own time to answer. The command returns when the turn
  # has finished, so this is how long a continuation may take before ccresu gives
  # up on it and records the attempt as a deadline. The default is 30m.
  turn_timeout: 30m
  max_concurrent_recoveries: 3
  # PRD 5 guardrails. Both knobs are optional, and an unset knob means the
  # behaviour ccresu had before it existed: no check performed.
  guardrails:
    # The two spend caps are ccresu's own checks, not CLI flags: the flags that
    # would express them (--max-budget-usd, --max-turns) are print mode only and
    # cannot ride a resume. Both default to 0 (off), because a non-zero default
    # would change behaviour on an upgrade nobody asked to change.
    #
    # They sum the costs the CLI reported across this session's attempts, which
    # is the same client-side estimate the CLI itself uses — it can differ from
    # the bill, and spend can pass the cap, so leave headroom.
    max_cost_usd_per_session: 0    # e.g. 5.00: refuse a new attempt at $5
    max_cost_usd_per_attempt: 0    # e.g. 2.00: stop recovery after one attempt over $2

telegram:
  enabled: false
  bot_token: ""              # prefer the CCRESU_TELEGRAM__BOT_TOKEN environment variable
  chat_id: ""
  parse_mode: HTML            # the only accepted value: the templates are HTML
  notify_limit_detected: true
  notify_waiting: false
  notify_recovery_started: true
  notify_recovery_success: true
  notify_recovery_failure: true
  notify_permanent_failure: true
  notify_session_completed: true

server:
  enabled: true
  host: 127.0.0.1
  port: 8787
  # Origins allowed to make read-only requests from a browser. State-changing
  # requests always require the bearer token written to the config directory.
  allowed_origins:
    - http://127.0.0.1:8787
    - http://localhost:8787
    - https://jymchng.github.io

storage:
  driver: sqlite
  path: ~/.local/share/ccresu/ccresu.db
  busy_timeout: 5s
